[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bask-voice-companion"
version = "0.1.0"
description = "Local feasibility service for basketball voice commands"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
bask-voice-companion = "voice_companion.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
